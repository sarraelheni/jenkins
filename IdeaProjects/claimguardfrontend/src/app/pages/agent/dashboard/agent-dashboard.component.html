<div class="page">
  <div class="head">
    <div>
      <h2>Agent Dashboard</h2>
      <p class="muted">Pending claims to review.</p>
    </div>
  </div>

  <div *ngIf="loading" class="state">Loading...</div>
  <div *ngIf="!loading && error" class="state error">{{ error }}</div>

  <table class="table" *ngIf="!loading && !error && pending.length">
    <thead>
    <tr><th>Title</th><th>Type</th><th>User</th><th class="right">Requested</th><th class="right">Action</th></tr>
    </thead>
    <tbody>
    <tr *ngFor="let c of pending">
      <td>{{ c.title }}</td>
      <td>{{ c.type }}</td>
      <td>{{ c.user?.email || '-' }}</td>
      <td class="right">{{ c.amount }}</td>
      <td class="right">
        <a class="btn-sm" [routerLink]="['/agent/claims', c.id, 'review']">Review</a>
      </td>
    </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !error && !pending.length" class="state">
    No pending claims.
  </div>
</div>
